name: photo_cleaner
description: Photo Cleaner - review, cull and clean up your photo library.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  photo_manager: ^3.5.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  crypto: ^3.0.3
  image: ^4.2.0
  flutter_local_notifications: ^18.0.1
  cryptography: ^2.7.0
  flutter_secure_storage: ^10.0.0
  local_auth: ^3.0.0
  share_plus: ^13.0.0
  cross_file: ^0.3.4
  google_mlkit_text_recognition: ^0.17.1
  light_compressor_v2: ^1.10.0
  video_player: ^2.9.2
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Regenerate launcher icons with:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/icon_bg.png"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  adaptive_icon_monochrome: "assets/icon/icon_mono.png"
  min_sdk_android: 24
