name: photo_cleaner
description: Photo Cleaner - review, cull and clean up your photo library.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  photo_manager: ^3.5.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  crypto: ^3.0.3
  image: ^4.2.0
  flutter_local_notifications: ^18.0.1
  cryptography: ^2.7.0
  flutter_secure_storage: ^10.0.0
  local_auth: ^3.0.0
  share_plus: ^13.0.0
  cross_file: ^0.3.4
  google_mlkit_text_recognition: ^0.17.1
  light_compressor_v2: ^1.10.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
